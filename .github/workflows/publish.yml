name: Zernyth release wheel (manual)
run-name: Release wheel ${{ inputs.commit }} / ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Reviewed full 40-character release commit SHA
        required: true
        type: string
      target:
        description: Explicit upload target; environment protection rules also apply
        type: choice
        default: build-only
        options: [build-only, testpypi, pypi]
      validated_run:
        description: Optional successful build-only run ID to promote unchanged artifacts
        required: false
        default: ''
        type: string
      linux_bds_sha256:
        description: SHA-256 of the validated Linux bedrock_server 1.26.60.6 executable (needed for a new build)
        required: false
        default: ''
        type: string

permissions:
  contents: read
concurrency:
  group: zernyth-publishing
  cancel-in-progress: false

jobs:
  wheel:
    if: github.repository == 'MakisImperium/endstone-zernyth' && inputs.validated_run == ''
    runs-on: windows-2025
    timeout-minutes: 90
    outputs:
      wheel-sha256: ${{ steps.wheel_digest.outputs.sha256 }}
    env:
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_TARGET: ${{ inputs.target }}
      PYTHONUTF8: '1'
    steps:
      - name: Validate the release SHA input
        shell: pwsh
        run: |
          if ($env:RELEASE_COMMIT -notmatch '^[0-9a-f]{40}$') {
            throw 'Provide the reviewed full release commit SHA.'
          }
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15.2'
          architecture: x64
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Select and fingerprint the installed Windows toolchain
        id: toolchain
        run: python scripts/zernyth_hosted_ci.py toolchain
      - uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: |
            ${{ env.CONAN_HOME }}
            ${{ env.GRADLE_USER_HOME }}
            ${{ env.ZERNYTH_HOSTED_TOOLS }}
            ${{ env.ZERNYTH_WHEELHOUSE }}
          key: zernyth-hosted-win-v1-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('config/zernyth-publish-conan.lock', 'config/conan/windows-hosted.profile', 'config/conan/windows-sanitized.profile', 'config/ci/windows-python-requirements.txt', 'scripts/zernyth_hosted_ci.py') }}
      - name: Provision the approved pinned build dependencies
        env:
          ZERNYTH_ALLOW_HOSTED_DOWNLOADS: '1'
          ZERNYTH_CONAN_CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
        run: python scripts/zernyth_hosted_ci.py prepare
      - uses: actions/cache/save@v4
        if: steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ env.CONAN_HOME }}
            ${{ env.GRADLE_USER_HOME }}
            ${{ env.ZERNYTH_HOSTED_TOOLS }}
            ${{ env.ZERNYTH_WHEELHOUSE }}
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Verify exact release commit and production tag
        run: python scripts/zernyth_wheel.py release-ref
      - name: Build matching native and Java components using offline caches
        shell: cmd
        run: |
          python scripts/zernyth_release.py build --gradle "%ZERNYTH_GRADLE%" --lockfile config/zernyth-publish-conan.lock --test-host build/RelWithDebInfo/tests/zernyth_java_test_host.dll
          if errorlevel 1 exit /b %errorlevel%
          python scripts/zernyth_release.py test --test-host build/RelWithDebInfo/tests/zernyth_java_test_host.dll
          if errorlevel 1 exit /b %errorlevel%
          python -m unittest discover -s tests -p "test_zernyth_*.py" > build/python-tooling.log 2>&1
          set "test_exit=%errorlevel%"
          type build\python-tooling.log
          if not "%test_exit%"=="0" exit /b %test_exit%
          python -m pip wheel --no-build-isolation --no-deps --no-index -Cnative-build-dir=build/RelWithDebInfo --wheel-dir dist .
          if errorlevel 1 exit /b %errorlevel%
          python scripts/zernyth_wheel.py install-test --wheel-dir dist --wheelhouse "%ZERNYTH_WHEELHOUSE%" --require-sanitized --api-tests > build/wheel-install.jsonl
          set "install_exit=%errorlevel%"
          type build\wheel-install.jsonl
          if not "%install_exit%"=="0" exit /b %install_exit%
          python scripts/zernyth_sdk.py --output build/zernyth-sdk-1.0.1.zip
          if errorlevel 1 exit /b %errorlevel%
          python scripts/zernyth_ci.py bundle --wheel dist/zernyth_engine-1.0.1-cp315-cp315-win_amd64.whl --sdk build/zernyth-sdk-1.0.1.zip --artifact-dir publish-bundle
          exit /b %errorlevel%
      - name: Record the validated wheel digest
        id: wheel_digest
        run: python scripts/zernyth_ci.py digest --wheel dist/zernyth_engine-1.0.1-cp315-cp315-win_amd64.whl
      - uses: actions/upload-artifact@v7
        with:
          name: zernyth-windows-${{ inputs.commit }}
          path: publish-bundle/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve bounded validation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zernyth-diagnostics-${{ inputs.commit }}
          path: |
            build/release-013/*.json
            build/release-013/*.xml
            build/release-013/*final.log
            build/python-tooling.log
            build/wheel-install.jsonl
          if-no-files-found: ignore
          retention-days: 7

  linux:
    if: github.repository == 'MakisImperium/endstone-zernyth' && inputs.validated_run == ''
    # The self-hosted runner provides Clang 20/libc++ 20, JDK 25, Conan caches with the reviewed Linux recipes,
    # patchelf, CONAN_HOME, ZERNYTH_BUILD_PATH_ROOT and a CPython 3.15 wheelhouse in ZERNYTH_WHEELHOUSE_315.
    runs-on: [self-hosted, zernyth-linux-temurin25]
    timeout-minutes: 120
    outputs:
      wheel-sha256: ${{ steps.linux_digest.outputs.sha256 }}
    env:
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_TARGET: ${{ inputs.target }}
      BDS_SHA256: ${{ inputs.linux_bds_sha256 }}
      WHEEL: zernyth_engine-1.0.1-cp315-cp315-manylinux_2_39_x86_64.whl
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate inputs and runner prerequisites
        run: |
          [[ $RELEASE_COMMIT =~ ^[0-9a-f]{40}$ ]] || { echo 'Provide the reviewed full release commit SHA.'; exit 1; }
          [[ $BDS_SHA256 =~ ^[0-9a-f]{64}$ ]] || { echo 'Provide linux_bds_sha256 (sha256sum bedrock_server of the validated BDS 1.26.60.6).'; exit 1; }
          for name in CONAN_HOME ZERNYTH_BUILD_PATH_ROOT ZERNYTH_WHEELHOUSE_315; do
            [[ -n ${!name:-} ]] || { echo "The runner must set $name."; exit 1; }
          done
          command -v patchelf >/dev/null || { echo 'The runner needs patchelf for auditwheel.'; exit 1; }
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15.2'
          architecture: x64
      - name: Install build tools from the runner wheelhouse
        run: python -m pip install --no-index --find-links "$ZERNYTH_WHEELHOUSE_315" packaging auditwheel
      - name: Verify exact release commit and production tag
        run: python scripts/zernyth_wheel.py release-ref
      - name: Build matching native and Java components using offline caches
        run: |
          python scripts/zernyth_release.py build --linux-release --lockfile config/zernyth-linux-conan.lock
          python scripts/zernyth_release.py test
      - name: Build the wheel and repair it to manylinux
        run: |
          python -m pip wheel --no-build-isolation --no-deps --no-index -Cnative-build-dir=build/RelWithDebInfo \
            -Cbds-sha256="$BDS_SHA256" --wheel-dir build/linux-raw .
          # libpython comes from the user's CPython; the JVM is loaded from the selected JDK at runtime.
          python -m auditwheel repair --plat manylinux_2_39_x86_64 --exclude 'libpython3.15.so*' --exclude 'libjvm.so' \
            -w dist build/linux-raw/zernyth_engine-1.0.1-cp315-cp315-linux_x86_64.whl
          test -f "dist/$WHEEL"
      - name: Install the wheel into a fresh environment
        run: |
          python -m venv build/wheel-test
          build/wheel-test/bin/python -m pip install --no-index --find-links "$ZERNYTH_WHEELHOUSE_315" "dist/$WHEEL"
          build/wheel-test/bin/python -m pip check
          build/wheel-test/bin/python -I -c "import endstone._python; import zernyth.cli as c; c.reject_conflicting_distribution()"
          build/wheel-test/bin/zernyth --version | grep -F 'Zernyth Engine 1.0.1'
          if [[ -n ${ZERNYTH_TEST_BDS:-} ]]; then build/wheel-test/bin/zernyth --check --server "$ZERNYTH_TEST_BDS"; fi
      - name: Record the validated wheel digest
        id: linux_digest
        run: echo "sha256=$(sha256sum "dist/$WHEEL" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: zernyth-linux-${{ inputs.commit }}
          path: dist/${{ env.WHEEL }}
          if-no-files-found: error
          retention-days: 30

  promote:
    if: github.repository == 'MakisImperium/endstone-zernyth' && inputs.validated_run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      wheel-sha256: ${{ steps.verified.outputs.sha256 }}
      linux-sha256: ${{ steps.linux_verified.outputs.sha256 }}
    env:
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the successful source build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATED_RUN: ${{ inputs.validated_run }}
        run: python scripts/zernyth_ci.py approved-run --validated-run "$VALIDATED_RUN"
      - uses: actions/download-artifact@v8
        with:
          name: zernyth-windows-${{ inputs.commit }}
          run-id: ${{ inputs.validated_run }}
          github-token: ${{ github.token }}
          path: publish-bundle
      - name: Verify immutable payload and validation evidence
        id: verified
        env:
          VALIDATED_RUN: ${{ inputs.validated_run }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          if [ "$RELEASE_TARGET" = pypi ]; then
            test "$(git rev-parse 'refs/tags/v1.0.1^{commit}')" = "$RELEASE_COMMIT"
          fi
          python scripts/zernyth_ci.py verify-bundle --artifact-dir publish-bundle --validated-run "$VALIDATED_RUN"
      - uses: actions/upload-artifact@v7
        with:
          name: zernyth-windows-${{ inputs.commit }}
          path: publish-bundle/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/download-artifact@v8
        with:
          name: zernyth-linux-${{ inputs.commit }}
          run-id: ${{ inputs.validated_run }}
          github-token: ${{ github.token }}
          path: linux-bundle
      - name: Record the promoted Linux wheel digest
        id: linux_verified
        run: echo "sha256=$(sha256sum linux-bundle/zernyth_engine-1.0.1-cp315-cp315-manylinux_2_39_x86_64.whl | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: zernyth-linux-${{ inputs.commit }}
          path: linux-bundle/
          if-no-files-found: error
          retention-days: 30

  testpypi:
    if: always() && inputs.target == 'testpypi' && github.repository == 'MakisImperium/endstone-zernyth' && ((needs.wheel.result == 'success' && needs.linux.result == 'success') || needs.promote.result == 'success')
    needs: [wheel, linux, promote]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/zernyth-engine
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: zernyth-windows-${{ inputs.commit }}
          path: publish-bundle
      - name: Verify the exact validated build artifact
        env:
          EXPECTED_SHA256: ${{ needs.wheel.outputs.wheel-sha256 || needs.promote.outputs.wheel-sha256 }}
        run: printf '%s  %s\n' "$EXPECTED_SHA256" 'publish-bundle/dist/zernyth_engine-1.0.1-cp315-cp315-win_amd64.whl' | sha256sum --check --strict
      - uses: actions/download-artifact@v8
        with:
          name: zernyth-linux-${{ inputs.commit }}
          path: publish-bundle/dist
      - name: Verify the exact validated Linux wheel
        env:
          EXPECTED_SHA256: ${{ needs.linux.outputs.wheel-sha256 || needs.promote.outputs.linux-sha256 }}
        run: printf '%s  %s\n' "$EXPECTED_SHA256" 'publish-bundle/dist/zernyth_engine-1.0.1-cp315-cp315-manylinux_2_39_x86_64.whl' | sha256sum --check --strict
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: publish-bundle/dist/

  pypi:
    if: always() && inputs.target == 'pypi' && github.repository == 'MakisImperium/endstone-zernyth' && ((needs.wheel.result == 'success' && needs.linux.result == 'success') || needs.promote.result == 'success')
    needs: [wheel, linux, promote]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/zernyth-engine
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: zernyth-windows-${{ inputs.commit }}
          path: publish-bundle
      - name: Verify the exact validated build artifact
        env:
          EXPECTED_SHA256: ${{ needs.wheel.outputs.wheel-sha256 || needs.promote.outputs.wheel-sha256 }}
        run: printf '%s  %s\n' "$EXPECTED_SHA256" 'publish-bundle/dist/zernyth_engine-1.0.1-cp315-cp315-win_amd64.whl' | sha256sum --check --strict
      - uses: actions/download-artifact@v8
        with:
          name: zernyth-linux-${{ inputs.commit }}
          path: publish-bundle/dist
      - name: Verify the exact validated Linux wheel
        env:
          EXPECTED_SHA256: ${{ needs.linux.outputs.wheel-sha256 || needs.promote.outputs.linux-sha256 }}
        run: printf '%s  %s\n' "$EXPECTED_SHA256" 'publish-bundle/dist/zernyth_engine-1.0.1-cp315-cp315-manylinux_2_39_x86_64.whl' | sha256sum --check --strict
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish-bundle/dist/
