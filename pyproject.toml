[build-system]
requires = ["packaging==26.3"]
build-backend = "zernyth_build"
backend-path = ["packaging"]

[project]
name = "zernyth-engine"
version = "0.9.0a1"
authors = [{ name = "Vincent Wu", email = "magicdroidx@gmail.com" }]
description = "Java 25 plugin framework integrated into Endstone and the original Bedrock Dedicated Server."
readme = "packaging/README.md"
requires-python = ">=3.11"
keywords = ["plugin", "python", "minecraft", "bedrock"]
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "aiohttp",
    "click",
    "colorlog",
    "importlib-metadata",
    "importlib-resources",
    "lazy-loader",
    "numpy",
    "packaging",
    "pip",
    "pkginfo",
    "psutil",
    "pyyaml",
    "requests",
    "rich",
    "tomlkit",
    "typing-extensions",
]


[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Changelog = "https://github.com/MakisImperium/endstone-zernyth/blob/main/CHANGELOG.md"
Documentation = "https://github.com/MakisImperium/endstone-zernyth/blob/main/docs/pypi.md"
Homepage = "https://github.com/MakisImperium/endstone-zernyth"
Issues = "https://github.com/MakisImperium/endstone-zernyth/issues"

[project.scripts]
zernyth = "zernyth.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--ignore=tests/plugin"]

[tool.ruff]
line-length = 120
lint.extend-select = ["I", "E", "F"]

# Wheels use packaging/zernyth_build.py and the explicit Windows publishing workflow.
# No cibuildwheel repair/upload hook from upstream is used for this distribution.
